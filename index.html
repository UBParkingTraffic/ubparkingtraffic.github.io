  <!DOCTYPE html>

    <title>حالة الزحمة في بوابات الجامعة</title>
    <style>
        body {
            font-family: "Tahoma", sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .gate {
            background: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .gate img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .status-bar {
            height: 35px;
            border-radius: 10px;
            background: #ddd;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
        }

        .buttons button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            color: white;
        }

        .red { background: #e74c3c; }
        .yellow { background: #f1c40f; color: black; }
        .green { background: #2ecc71; }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #777;
            font-size: 14px;
        }
    </style>

    <script>
        function updateStatus(gateId, status, color) {
            const bar = document.getElementById(gateId);
            bar.innerText = status;
            bar.style.background = color;
            bar.style.color = "white";
        }
    </script>
</head>
