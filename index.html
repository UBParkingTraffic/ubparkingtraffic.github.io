<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حالة الزحمة في بوابات الجامعة</title>
    <style>
        body {
            font-family: "Tahoma", sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .gate {
            background: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .gate img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .status-bar {
            height: 35px;
            border-radius: 10px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
            transition: background 0.3s ease;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #777;
            font-size: 14px;
        }

        .connection-status {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
        }

        .logo-corner {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 90px;
            height: auto;
            z-index: 1000;
        }
    </style>
</head>

    <div id="gate5" class="status-bar">لم يتم التحديث بعد</div>

<div class="footer">
    مشروع طلاب جامعة — عرض حالة الزحمة في البوابات
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getFirestore,
    doc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAhiGnILL6LGh08KBm-XorbA8zrkBxAlw4",
    authDomain: "parking-traffic-ub.firebaseapp.com",
    projectId: "parking-traffic-ub",
    storageBucket: "parking-traffic-ub.firebasestorage.app",
    messagingSenderId: "381941847985",
    appId: "1:381941847985:web:0e2842876f03bd96ec4f90",
    measurementId: "G-E553TDP785"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const gateIds = ["gate1", "gate2", "gate3", "gate4", "gate5"];

  // كل بوابة "تستمع" للتغييرات في Firestore وتحدث نفسها لحظيًا
  gateIds.forEach((gateId) => {
    onSnapshot(doc(db, "gates", gateId), (docSnap) => {
      const bar = document.getElementById(gateId);
      if (docSnap.exists()) {
        const data = docSnap.data();
        bar.innerText = data.status;
        bar.style.background = data.color;
        bar.style.color = "white";
      } else {
        bar.innerText = "لم يتم التحديث بعد";
        bar.style.background = "#ddd";
        bar.style.color = "#333";
      }
    }, (error) => {
      console.error("خطأ في الاستماع للتحديثات:", error);
      document.getElementById("connectionStatus").innerText = "تعذر الاتصال بالخادم";
    });
  });

  document.getElementById("connectionStatus").innerText = "متصل ✓ التحديثات لحظية";
</script>
