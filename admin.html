  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم المسؤول - حالة البوابات</title>
    <style>
        body {
            font-family: "Tahoma", sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .warning {
            text-align: center;
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .gate {
            background: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .status-bar {
            height: 35px;
            border-radius: 10px;
            background: #ddd;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
            transition: background 0.3s ease;
        }

        .buttons button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            color: white;
        }

        .red { background: #e74c3c; }
        .yellow { background: #f1c40f; color: black; }
        .green { background: #2ecc71; }

        .connection-status {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<h1>لوحة تحكم المسؤول</h1>
<div class="warning">هذه الصفحة خاصة بالمسؤول فقط — لا تشارك هذا الرابط</div>
<div class="connection-status" id="connectionStatus">جارٍ الاتصال بالخادم...</div>

<div class="gate">
    <h2>البوابة 1</h2>
    <div id="gate1" class="status-bar">لم يتم التحديث بعد</div>
    <div class="buttons">
        <button class="red" onclick="updateStatus('gate1','مزدحم','#e74c3c')">مزدحم</button>
        <button class="yellow" onclick="updateStatus('gate1','متوسط','#f1c40f')">متوسط</button>
        <button class="green" onclick="updateStatus('gate1','فاضي','#2ecc71')">فاضي</button>
    </div>
</div>

<div class="gate">
    <h2>البوابة 2</h2>
    <div id="gate2" class="status-bar">لم يتم التحديث بعد</div>
    <div class="buttons">
        <button class="red" onclick="updateStatus('gate2','مزدحم','#e74c3c')">مزدحم</button>
        <button class="yellow" onclick="updateStatus('gate2','متوسط','#f1c40f')">متوسط</button>
        <button class="green" onclick="updateStatus('gate2','فاضي','#2ecc71')">فاضي</button>
    </div>
</div>

<div class="gate">
    <h2>البوابة 3</h2>
    <div id="gate3" class="status-bar">لم يتم التحديث بعد</div>
    <div class="buttons">
        <button class="red" onclick="updateStatus('gate3','مزدحم','#e74c3c')">مزدحم</button>
        <button class="yellow" onclick="updateStatus('gate3','متوسط','#f1c40f')">متوسط</button>
        <button class="green" onclick="updateStatus('gate3','فاضي','#2ecc71')">فاضي</button>
    </div>
</div>

<div class="gate">
    <h2>البوابة 4</h2>
    <div id="gate4" class="status-bar">لم يتم التحديث بعد</div>
    <div class="buttons">
        <button class="red" onclick="updateStatus('gate4','مزدحم','#e74c3c')">مزدحم</button>
        <button class="yellow" onclick="updateStatus('gate4','متوسط','#f1c40f')">متوسط</button>
        <button class="green" onclick="updateStatus('gate4','فاضي','#2ecc71')">فاضي</button>
    </div>
</div>

<div class="gate">
    <h2>البوابة 5</h2>
    <div id="gate5" class="status-bar">لم يتم التحديث بعد</div>
    <div class="buttons">
        <button class="red" onclick="updateStatus('gate5','مزدحم','#e74c3c')">مزدحم</button>
        <button class="yellow" onclick="updateStatus('gate5','متوسط','#f1c40f')">متوسط</button>
        <button class="green" onclick="updateStatus('gate5','فاضي','#2ecc71')">فاضي</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getFirestore,
    doc,
    setDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAhiGnILL6LGh08KBm-XorbA8zrkBxAlw4",
    authDomain: "parking-traffic-ub.firebaseapp.com",
    projectId: "parking-traffic-ub",
    storageBucket: "parking-traffic-ub.firebasestorage.app",
    messagingSenderId: "381941847985",
    appId: "1:381941847985:web:0e2842876f03bd96ec4f90",
    measurementId: "G-E553TDP785"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const gateIds = ["gate1", "gate2", "gate3", "gate4", "gate5"];

  // تحديث الحالة: يكتب في Firestore، وهذا ينعكس تلقائيًا في index.html عند الجميع
  window.updateStatus = async function (gateId, status, color) {
    try {
      await setDoc(doc(db, "gates", gateId), {
        status: status,
        color: color,
        updatedAt: Date.now()
      });
    } catch (err) {
      console.error("خطأ أثناء حفظ الحالة:", err);
      alert("صار خطأ أثناء تحديث الحالة، تأكد من اتصالك بالإنترنت.");
    }
  };

  // عرض الحالة الحالية هنا أيضًا، عشان المسؤول يشوف آخر تحديث
  gateIds.forEach((gateId) => {
    onSnapshot(doc(db, "gates", gateId), (docSnap) => {
      const bar = document.getElementById(gateId);
      if (docSnap.exists()) {
        const data = docSnap.data();
        bar.innerText = data.status;
        bar.style.background = data.color;
        bar.style.color = "white";
      }
    });
  });

  document.getElementById("connectionStatus").innerText = "متصل ✓";
</script>

</body>
</html>
    
  </body>
  
</html>
